<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#29233b"><meta name="description" content="VELORA — ruang pribadi untuk mengatur waktu, uang, dan kebiasaan.">
<title>VELORA — Life Organizer</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./velora-192.png">
<link rel="apple-touch-icon" href="./velora-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VELORA">

<style>
:root{--bg:#f7f5fa;--panel:#fff;--ink:#29233b;--muted:#8b8499;--line:#e9e3ef;--purple:#8066a8;--lav:#eee7f5;--lav2:#d9c9e9;--green:#548779;--red:#c66d82;--gold:#c59a58;--shadow:0 12px 34px #30243b0b;color-scheme:light}
:root[data-theme=dark]{--bg:#171421;--panel:#211c2b;--ink:#f1ecf6;--muted:#aaa0b7;--line:#3a3246;--purple:#b69acd;--lav:#342a40;--lav2:#493a55;--green:#79b5a4;--red:#e18a9e;--gold:#e2bd83;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#eee7f8 0,transparent 30%),var(--bg);color:var(--ink);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:100px} :root[data-theme=dark] body{background:radial-gradient(circle at 90% 0,#30263d 0,transparent 32%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;min-height:44px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #8066a81c}textarea{resize:vertical;min-height:76px}
header{max-width:760px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 22px 12px;display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:15px;background:#29233b;color:#f5effb;display:grid;place-items:center;font:600 26px Georgia;box-shadow:0 7px 18px #29233b22}.brand{min-width:0}.brand strong{display:block;font-size:18px;letter-spacing:.24em}.brand small{font-size:9px;letter-spacing:.14em;color:var(--mut)}.edition{margin-left:auto;border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:9px;letter-spacing:.1em;color:var(--mut)}
main{max-width:760px;margin:auto;padding:8px 22px;display:grid;gap:14px}.hero{background:linear-gradient(125deg,#302941,#5a486c);color:#faf6ff;border-radius:23px;padding:22px;position:relative;overflow:hidden;box-shadow:0 14px 32px #30294120}.hero:after{content:"V";position:absolute;right:16px;top:-35px;font:170px Georgia;color:#ffffff0c}.eyebrow{font-size:9px;letter-spacing:.2em;color:#d9cce5;text-transform:uppercase}.hero h1{font:500 27px/1.18 Georgia,serif;margin:8px 0;max-width:420px}.hero p{font-size:12px;color:#e5dce9;max-width:460px;margin:0}.hero-row{display:flex;justify-content:space-between;align-items:end;gap:12px;position:relative;z-index:1}.date-label{font-size:11px;color:#dfd3e8}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0}.section-head h2{font-size:16px;margin:0}.section-head p{margin:2px 0 0;color:var(--mut);font-size:11px}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px}.card-title{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);font-weight:700}.muted{color:var(--mut)}.small{font-size:11px;color:var(--mut)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wrap{flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}.stat span{display:block;color:var(--mut);font-size:10px}.stat b{display:block;font-size:clamp(12px,3vw,17px);overflow-wrap:anywhere;margin-top:3px}.green{color:var(--green)}.red{color:var(--red)}.purple{color:var(--purple)}
.btn{border:0;border-radius:12px;background:var(--lav2);color:#38264c;padding:11px 15px;min-height:43px;font-weight:700}.btn.primary{background:#302941;color:#fff}.btn.soft{background:var(--lav);color:var(--purple)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:#f8e9ed;color:#a34e66}.btn.smallbtn{padding:7px 10px;min-height:34px;font-size:11px}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.field{display:grid;gap:5px;min-width:0}.field label{font-size:11px;color:var(--mut)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form-grid .wide{grid-column:1/-1}.progress{height:8px;border-radius:99px;background:var(--lav);overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#8b78a8,#b7a2ce);border-radius:99px}.pill{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:4px 8px;color:var(--mut);white-space:nowrap}.pill.active{background:var(--lav);color:var(--purple);border-color:var(--lav2)}.list{display:grid;gap:8px}.entry{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px;min-width:0}.entry .grow{flex:1;min-width:0}.entry b{font-size:13px;font-weight:600;display:block;overflow-wrap:anywhere}.entry small{display:block;color:var(--mut);font-size:10px}.entry.done b{text-decoration:line-through;color:var(--mut)}.check{width:29px;height:29px;flex:0 0 29px;border:1.5px solid var(--green);border-radius:9px;background:transparent;color:var(--green);font-weight:800}.entry.done .check{background:var(--green);color:white}.iconbtn{border:0;background:transparent;color:var(--mut);font-size:18px;padding:5px}.empty{padding:18px;text-align:center;color:var(--mut);font-size:12px;border:1px dashed var(--line);border-radius:14px}.tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;background:var(--panel);padding:6px;border:1px solid var(--line);border-radius:16px;position:sticky;top:4px;z-index:5;box-shadow:var(--shadow)}.tabs button{border:0;background:transparent;border-radius:11px;padding:9px 2px;color:var(--mut);font-size:10px;font-weight:650;min-width:0}.tabs button span{display:block;font-size:16px;margin-bottom:2px}.tabs button.active{background:var(--lav);color:var(--purple)}.month-nav{display:flex;align-items:center;justify-content:space-between}.month-nav button{width:36px;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:11px}.transaction{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px}.budget-row{display:grid;grid-template-columns:78px 1fr auto;align-items:center;gap:8px;font-size:11px}.budget-row b{font-size:10px;white-space:nowrap}.habit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.habit{border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;gap:8px;align-items:center}.habit .grow{flex:1;min-width:0}.habit b{font-size:12px;display:block}.habit small{font-size:10px;color:var(--mut)}.calendar-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.daycell{border:1px solid var(--line);background:var(--panel);border-radius:11px;text-align:center;padding:8px 2px;font-size:10px;color:var(--mut)}.daycell b{display:block;color:var(--ink);font-size:12px}.daycell.today{border-color:var(--purple);background:var(--lav)}.notice{border-left:3px solid var(--gold);padding:9px 11px;background:var(--lav);border-radius:0 10px 10px 0;font-size:11px}.hidden{display:none!important}footer{max-width:760px;margin:22px auto;padding:0 22px;color:var(--mut);font-size:10px;text-align:center}
@media(max-width:520px){header{padding-left:16px;padding-right:16px}main{padding:7px 14px}.edition{display:none}.tabs button{font-size:9px}.tabs button span{font-size:15px}.stats{gap:6px}.stat{padding:10px 8px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.habit-grid{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style>
</head>
<body>
<header><div class="mark">V</div><div class="brand"><strong>VELORA</strong><small>YOUR PERSONAL LIFE ORGANIZER</small></div><span class="edition">COMPLETE EDITION</span></header>
<main>
<section class="hero"><div class="hero-row"><div><span class="eyebrow">A LITTLE MORE INTENTIONAL</span><h1 id="greeting">Make space for what matters.</h1><p id="heroSub">Atur waktu, keuangan, dan kebiasaanmu dalam satu ruang.</p></div><div class="date-label" id="todayLabel"></div></div></section>
<nav class="tabs" id="tabs" aria-label="Navigasi utama"></nav>
<section id="view"></section>
</main>
<footer>VELORA · Data tersimpan secara lokal di browser perangkat ini. Buat backup secara berkala.</footer>
<script>
(()=>{'use strict';
const OLD_KEY='dompet-sehat-jadwal-v1',KEY='velora-life-organizer-v2';
const $=s=>document.querySelector(s), today=()=>iso(new Date()), iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID'), fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'—';
const defaults=()=>({version:2,profile:{name:'',theme:'light'},tasks:[],tx:[],bud:{},goal:null,habits:[],study:[],reminders:[],settings:{notifications:false}});
let S=defaults(),page='home',month=new Date(new Date().getFullYear(),new Date().getMonth(),1),editTx=null,editTask=null;
function normalize(x){const d=defaults();return {...d,...x,profile:{...d.profile,...(x.profile||{})},settings:{...d.settings,...(x.settings||{})},tasks:Array.isArray(x.tasks)?x.tasks:[],tx:Array.isArray(x.tx)?x.tx:[],bud:x.bud||{},habits:Array.isArray(x.habits)?x.hab:[],study:Array.isArray(x.study)?x.study:[],reminders:Array.isArray(x.reminders)?x.reminders:[]}}
function load(){try{const n=localStorage.getItem(KEY);if(n){S=normalize(JSON.parse(n));return}}catch(e){}try{const old=localStorage.getItem(OLD_KEY);if(old){S=normalize(JSON.parse(old));save();}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){alert('Penyimpanan browser penuh atau tidak tersedia. Buat backup dan periksa ruang penyimpanan.')}}load();document.documentElement.dataset.theme=S.profile.theme||'light';
const tabs=[['home','⌂','Home'],['planner','▦','Planner'],['habit','✳','Habit'],['study','✎','Study'],['finance','◈','Finance'],['review','⌁','Review'],['settings','⚙','More']];
function txMonth(){const m=iso(month).slice(0,7);return S.tx.filter(t=>(t.date||'').slice(0,7)===m)}
function totals(list){return list.reduce((a,t)=>{a[t.type==='in'?'in':'out']+=Number(t.amt)||0;return a},{in:0,out:0})}
function dayTasks(d){const weekday=new Date(d+'T12:00:00').getDay();return S.tasks.filter(t=>{const start=t.from||t.date||'';if(!start||d<start)return false;if(t.daily)return true;if(Array.isArray(t.days))return t.days.includes(weekday);return t.date===d;})}
function doneCount(arr,d){return arr.filter(t=>t.done&&t.done[d]).length}
function section(title,sub=''){return `<div class="section-head"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div></div>`}
function card(title,body){return `<div class="card">${title?`<div class="card-title">${title}</div>`:''}${body}</div>`}
function stat(label,val,cls=''){return `<div class="stat"><span>${label}</span><b class="${cls}">${val}</b></div>`}
function bar(p){return `<div class="progress"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`}
function taskForm(t={}){const repeat=t.daily?'daily':Array.isArray(t.days)?'custom':'once';const selected=Array.isArray(t.days)?t.days:[];const labels=[['1','Sen'],['2','Sel'],['3','Rab'],['4','Kam'],['5','Jum'],['6','Sab'],['0','Min']];return `<form id="taskForm" class="card"><div class="card-title">${t.id?'Edit':'Tambah'} aktivitas</div><div class="form-grid"><div class="field wide"><label>Nama aktivitas</label><input name="name" maxlength="70" required value="${esc(t.name||'')}" placeholder="Contoh: Kerjakan tugas matematika"></div><div class="field"><label>Tanggal mulai</label><input name="date" type="date" required value="${t.from||t.date||today()}"></div><div class="field"><label>Jam</label><input name="time" type="time" value="${t.time||''}"></div><div class="field"><label>Pengulangan</label><select name="repeat"><option value="once" ${repeat==='once'?'selected':''}>Sekali</option><option value="daily" ${repeat==='daily'?'selected':''}>Setiap hari</option><option value="custom" ${repeat==='custom'?'selected':''}>Hari tertentu</option></select></div><div class="field"><label>Prioritas</label><select name="priority"><option value="normal">Normal</option><option value="high" ${t.imp?'selected':''}>Penting</option></select></div><div class="field wide ${repeat==='custom'?'':'hidden'}" id="weekdayPicker"><label>Pilih hari (bisa lebih dari satu)</label><div class="actions">${labels.map(([v,l])=>`<label class="pill ${selected.includes(Number(v))?'active':''}" style="display:flex;align-items:center;gap:6px"><input type="checkbox" name="days" value="${v}" ${selected.includes(Number(v))?'checked':''} style="width:auto;min-height:0"> ${l}</label>`).join('')}</div><small class="muted">Aktivitas hanya muncul pada hari yang dipilih, mulai dari tanggal mulai.</small></div></div><div class="actions"><button class="btn ghost" type="button" data-action="cancel-task">Batal</button><button class="btn primary">Simpan aktivitas</button></div></form>`}function plannerView(){const d=today(),arr=dayTasks(d).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));return `${section('Planner','Susun aktivitas harian dan lihat apa yang perlu diselesaikan.')}<div class="stats">${stat('Hari ini',arr.length+' aktivitas')}${stat('Selesai',doneCount(arr,d)+' aktivitas','green')}${stat('Progress',Math.round(arr.length?doneCount(arr,d)/arr.length*100:0)+'%','purple')}</div>${bar(arr.length?doneCount(arr,d)/arr.length*100:0)}<div class="actions"><button class="btn primary" data-action="new-task">＋ Aktivitas</button><button class="btn soft" data-action="new-study">＋ Tugas belajar</button></div>${editTask?taskForm(editTask):''}${card('JADWAL HARI INI',arr.length?`<div class="list">${arr.map(t=>`<div class="entry ${t.done&&t.done[d]?'done':''}"><button class="check" data-action="toggle-task" data-id="${t.id}">${t.done&&t.done[d]?'✓':''}</button><div class="grow"><b>${esc(t.name)}</b><small>${t.time||'Tanpa jam'} · ${t.imp?'★ Prioritas':'Aktivitas'}</small></div><button class="iconbtn" data-action="edit-task" data-id="${t.id}">✎</button><button class="iconbtn" data-action="delete-task" data-id="${t.id}">×</button></div>`).join('')}</div>`:'<div class="empty">Belum ada aktivitas hari ini. Tambahkan satu untuk mulai.</div>')}${card('MINGGU INI',`<div class="calendar-strip">${Array.from({length:7},(_,i)=>{const dt=new Date();dt.setDate(dt.getDate()-dt.getDay()+i);const k=iso(dt),a=dayTasks(k);return `<div class="daycell ${k===d?'today':''}">${['Min','Sen','Sel','Rab','Kam','Jum','Sab'][i]}<b>${dt.getDate()}</b><small>${doneCount(a,k)}/${a.length}</small></div>`}).join('')}</div>`)}`}
function habitView(){const d=today();return `${section('Habit tracker','Bangun konsistensi lewat kebiasaan kecil yang dilakukan berulang.')}<div class="row"><b>${fmtDate(d)}</b><button class="btn primary smallbtn" data-action="new-habit">＋ Habit</button></div>${card('KEBIASAAN HARI INI',S.habits.length?`<div class="habit-grid">${S.habits.map(h=>`<div class="habit"><button class="check" data-action="toggle-habit" data-id="${h.id}">${h.log&&h.log[d]?'✓':''}</button><div class="grow"><b>${esc(h.name)}</b><small>${habitStreak(h)} hari beruntun</small></div><button class="iconbtn" data-action="delete-habit" data-id="${h.id}">×</button></div>`).join('')}</div>`:'<div class="empty">Belum ada habit. Mulai dari satu kebiasaan sederhana.</div>')}${card('RINGKASAN KONSISTENSI',`<div class="stats">${stat('Habit aktif',S.habits.length)}${stat('Selesai hari ini',S.habits.filter(h=>h.log&&h.log[d]).length,'green')}${stat('Tingkat harian',Math.round(S.habits.length?S.habits.filter(h=>h.log&&h.log[d]).length/S.habits.length*100:0)+'%','purple')}</div>`)}`}
function habitStreak(h){let n=0,dt=new Date();for(let i=0;i<366;i++){const k=iso(dt);if(h.log&&h.log[k])n++;else if(i>0)break;dt.setDate(dt.getDate()-1)}return n}
function studyView(){const list=S.study.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return `${section('Study planner','Kelola tugas, proyek, dan deadline akademik.')}<button class="btn primary" data-action="new-study">＋ Tambah tugas belajar</button>${card('DAFTAR TUGAS',list.length?`<div class="list">${list.map(t=>`<div class="entry ${t.done?'done':''}"><button class="check" data-action="toggle-study" data-id="${t.id}">${t.done?'✓':''}</button><div class="grow"><b>${esc(t.name)}</b><small>${esc(t.subject||'Umum')} · Deadline ${fmtDate(t.due)}</small></div><span class="pill ${t.due<today()&&!t.done?'active':''}">${t.done?'Selesai':t.due<today()?'Terlambat':'Aktif'}</span><button class="iconbtn" data-action="edit-study" data-id="${t.id}">✎</button><button class="iconbtn" data-action="delete-study" data-id="${t.id}">×</button></div>`).join('')}</div>`:'<div class="empty">Belum ada tugas belajar. Catat deadline pertamamu.</div>')}`}
function financeView(){const list=txMonth().sort((a,b)=>b.date.localeCompare(a.date)),s=totals(list),bal=s.in-s.out;return `${section('Finance','Catat uang masuk dan keluar, atur anggaran, dan pantau tabungan.')}<div class="month-nav"><button data-action="month-prev">‹</button><b>${month.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</b><button data-action="month-next">›</button></div><div class="stats">${stat('Pemasukan',money(s.in),'green')}${stat('Pengeluaran',money(s.out),'red')}${stat('Selisih',money(bal),bal<0?'red':'purple')}</div>${card(editTx?'EDIT TRANSAKSI':'CATAT TRANSAKSI',`<form id="txForm"><div class="form-grid"><div class="field"><label>Jenis</label><select name="type"><option value="out" ${editTx?.type!=='in'?'selected':''}>Pengeluaran</option><option value="in" ${editTx?.type==='in'?'selected':''}>Pemasukan</option></select></div><div class="field"><label>Nominal (Rp)</label><input name="amt" type="number" min="1" required value="${editTx?.amt||''}" placeholder="25000"></div><div class="field"><label>Kategori</label><select name="cat">${['Makan','Transport','Jajan','Tabungan','Belajar','Tagihan','Uang saku','Gaji','Jualan','Lainnya'].map(c=>`<option ${editTx?.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Tanggal</label><input name="date" type="date" value="${editTx?.date||today()}" required></div><div class="field wide"><label>Catatan</label><input name="note" maxlength="80" value="${esc(editTx?.note||'')}" placeholder="Opsional"></div></div><div class="actions">${editTx?'<button type="button" class="btn ghost" data-action="cancel-tx">Batal</button>':''}<button class="btn primary">${editTx?'Simpan perubahan':'Tambah transaksi'}</button></div></form>`)}${card('ANGGARAN BULANAN',`<div class="field"><label>Atur batas total pengeluaran (Rp)</label><div class="row"><input id="totalBudget" type="number" min="0" placeholder="Contoh: 500000" value="${S.bud.__total||''}"><button class="btn soft" data-action="save-total-budget">Simpan</button></div></div><div class="row"><span class="small">Terpakai ${money(s.out)} dari ${S.bud.__total?money(S.bud.__total):'belum diatur'}</span><b class="${S.bud.__total&&s.out>S.bud.__total?'red':'green'}">${S.bud.__total?Math.round(s.out/S.bud.__total*100)+'%':'—'}</b></div>${bar(S.bud.__total?s.out/S.bud.__total*100:0)}<div class="field"><label>Batas per kategori</label><div class="form-grid"><select id="budgetCat">${['Makan','Transport','Jajan','Belajar','Lainnya'].map(c=>`<option>${c}</option>`).join('')}</select><input id="budgetAmt" type="number" min="0" placeholder="Batas (Rp)"></div><button class="btn soft" data-action="save-category-budget">Simpan anggaran kategori</button></div>${['Makan','Transport','Jajan','Belajar','Lainnya'].filter(c=>S.bud[c]).map(c=>{const used=list.filter(t=>t.type==='out'&&t.cat===c).reduce((a,t)=>a+t.amt,0),p=used/S.bud[c]*100;return `<div><div class="budget-row"><span>${c}</span>${bar(p)}<b class="${p>100?'red':''}">${money(used)} / ${money(S.bud[c])}</b></div></div>`}).join('')||'<small class="muted">Belum ada anggaran kategori.</small>'}`)}${card('RIWAYAT TRANSAKSI',list.length?`<div class="list">${list.map(t=>`<div class="entry transaction"><div class="grow"><b>${esc(t.cat)}${t.note?' · '+esc(t.note):''}</b><small>${fmtDate(t.date)}</small></div><b class="${t.type==='in'?'green':'red'}">${t.type==='in'?'+':'−'}${money(t.amt)}</b><button class="iconbtn" data-action="edit-tx" data-id="${t.id}">✎</button><button class="iconbtn" data-action="delete-tx" data-id="${t.id}">×</button></div>`).join('')}</div>`:'<div class="empty">Belum ada transaksi pada bulan ini.</div>')}`}
function reviewView(){const list=txMonth(),s=totals(list),d=today(),tasks=dayTasks(d),hab=S.habits.filter(h=>h.log&&h.log[d]).length,st=S.study.filter(t=>t.done).length;const monthTasks=S.tasks.filter(t=>(t.date||t.from||'').slice(0,7)===iso(month).slice(0,7));const completed=monthTasks.reduce((n,t)=>n+Object.values(t.done||{}).filter(Boolean).length,0);const by={};list.filter(t=>t.type==='out').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];return `${section('Monthly review','Lihat perkembangan dan tentukan fokus untuk periode berikutnya.')}<div class="month-nav"><button data-action="month-prev">‹</button><b>${month.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</b><button data-action="month-next">›</button></div><div class="stats">${stat('Pemasukan',money(s.in),'green')}${stat('Pengeluaran',money(s.out),'red')}${stat('Selisih',money(s.in-s.out),(s.in-s.out)<0?'red':'purple')}</div>${card('PRODUKTIVITAS',`<div class="stats">${stat('Aktivitas tercatat',monthTasks.length)}${stat('Checklist selesai',completed,'green')}${stat('Tugas belajar selesai',st,'purple')}</div><div class="row"><span class="small">Habit selesai hari ini</span><b>${hab}/${S.habits.length}</b></div>${bar(S.habits.length?hab/S.habits.length*100:0)}`)}${card('KESEHATAN KEUANGAN',`<div class="row"><span class="muted">Kategori pengeluaran terbesar</span><b>${top?esc(top[0]):'Belum ada'}</b></div><div class="row"><span class="muted">Nilai kategori terbesar</span><b>${top?money(top[1]):money(0)}</b></div><div class="row"><span class="muted">Target tabungan</span><b>${S.goal?esc(S.goal.name):'Belum dibuat'}</b></div><div class="row"><span class="muted">Akumulasi kategori Tabungan</span><b>${money(S.tx.filter(t=>t.type==='out'&&t.cat==='Tabungan').reduce((a,t)=>a+t.amt,0))}</b></div>`)}${card('CATATAN REFLEKSI',`<textarea id="reflection" placeholder="Apa yang berjalan baik bulan ini? Apa yang ingin diperbaiki?">${esc(S.reflections?.[iso(month).slice(0,7)]||'')}</textarea><button class="btn primary" data-action="save-reflection">Simpan refleksi</button><small class="muted">Refleksi disimpan lokal untuk bulan yang sedang dipilih.</small>`)}`}
function remindersView(){const list=S.reminders.slice().sort((a,b)=>a.date.localeCompare(b.date));return `${section('Pengingat','Daftar deadline dan pengingat yang akan muncul saat VELORA dibuka.')}<form id="reminderForm" class="card"><div class="card-title">BUAT PENGINGAT</div><div class="form-grid"><div class="field wide"><label>Judul</label><input name="title" required maxlength="70" placeholder="Contoh: Bayar uang kas"></div><div class="field"><label>Tanggal</label><input name="date" type="date" required value="${today()}"></div><div class="field"><label>Jam</label><input name="time" type="time" value="08:00"></div></div><button class="btn primary">Simpan pengingat</button></form>${card('PENGINGAT TERSIMPAN',list.length?`<div class="list">${list.map(r=>`<div class="entry"><div class="grow"><b>${esc(r.title)}</b><small>${fmtDate(r.date)} · ${r.time||'Sepanjang hari'}</small></div><span class="pill ${r.date<today()?'active':''}">${r.date<today()?'Lewat':r.date===today()?'Hari ini':'Mendatang'}</span><button class="iconbtn" data-action="delete-reminder" data-id="${r.id}">×</button></div>`).join('')}</div>`:'<div class="empty">Belum ada pengingat.</div>')}<div class="notice">Catatan: notifikasi browser memerlukan izin dan VELORA harus sedang terbuka. Pengingat tidak menjamin notifikasi berjalan saat browser ditutup.</div>`}
function settingsView(){return `${section('Pengaturan','Atur identitas, tampilan, notifikasi, dan keamanan data.')}<form id="settingsForm" class="card"><div class="card-title">PERSONALISASI</div><div class="field"><label>Nama panggilan</label><input name="name" maxlength="35" value="${esc(S.profile.name)}" placeholder="Namamu"></div><div class="field"><label>Tema tampilan</label><select name="theme"><option value="light" ${S.profile.theme!=='dark'?'selected':''}>Light · Lavender</option><option value="dark" ${S.profile.theme==='dark'?'selected':''}>Dark · Plum</option></select></div><button class="btn primary">Simpan pengaturan</button></form><button class="btn ghost" data-page="reminders">Kelola pengingat & deadline</button>${card('NOTIFIKASI BROWSER',`<p class="small">Aktifkan izin notifikasi agar pengingat dapat memberi pemberitahuan ketika aplikasi terbuka.</p><div class="row"><span>Status: <b>${'Notification' in window?Notification.permission:'Tidak didukung'}</b></span><button class="btn soft" data-action="enable-notifications">Aktifkan izin</button></div>`)}${card('TARGET TABUNGAN',`<form id="goalForm" class="form-grid"><div class="field"><label>Nama target</label><input name="name" maxlength="50" value="${esc(S.goal?.name||'')}" placeholder="Contoh: Laptop"></div><div class="field"><label>Target (Rp)</label><input name="target" type="number" min="1" value="${S.goal?.target||''}" placeholder="2000000"></div><div class="wide"><button class="btn primary">Simpan target</button></div></form>${S.goal?`<small class="muted">Target saat ini: ${esc(S.goal.name)} · ${money(S.goal.target)}</small>`:''}`)}${card('DATA & BACKUP',`<p class="small">Data tersimpan pada browser dan perangkat ini. Ekspor file JSON sebelum berpindah perangkat atau menghapus data browser.</p><div class="actions"><button class="btn soft" data-action="export">Ekspor backup</button><button class="btn ghost" data-action="import">Impor backup</button><input id="importFile" type="file" accept=".json,application/json" class="hidden"></div><button class="btn danger" data-action="reset">Hapus semua data</button>`)}`}

function weeklySummary(){
 const end=new Date();end.setHours(12,0,0,0);
 const days=[];
 for(let i=6;i>=0;i--){const dt=new Date(end);dt.setDate(end.getDate()-i);const key=iso(dt),tasks=dayTasks(key),taskDone=doneCount(tasks,key),habitDone=S.habits.filter(h=>h.log&&h.log[key]).length,possible=tasks.length+S.habits.length,completed=taskDone+habitDone;days.push({key,label:dt.toLocaleDateString('id-ID',{weekday:'short'}),date:dt.getDate(),tasks:tasks.length,taskDone,habitDone,possible,completed,rate:possible?Math.round(completed/possible*100):0})}
 const first=days[0].key,last=days[6].key;
 const tx=S.tx.filter(t=>t.date>=first&&t.date<=last),sum=totals(tx);
 const taskTotal=days.reduce((n,d)=>n+d.tasks,0),taskDoneTotal=days.reduce((n,d)=>n+d.taskDone,0);
 const habitPossible=S.habits.length*7,habitDoneTotal=days.reduce((n,d)=>n+d.habitDone,0);
 const max=Math.max(1,...days.map(d=>d.possible));
 return card('RINGKASAN 7 HARI TERAKHIR',`
 <div class="stats">
  ${stat('Aktivitas selesai',taskDoneTotal+'/'+taskTotal,'green')}
  ${stat('Konsistensi habit',habitPossible?Math.round(habitDoneTotal/habitPossible*100)+'%':'—','purple')}
  ${stat('Uang masuk',money(sum.in),'green')}
 </div>
 <div class="stats">
  ${stat('Uang keluar',money(sum.out),'red')}
  ${stat('Total habit selesai',habitDoneTotal+'/'+habitPossible)}
  ${stat('Periode',fmtDate(first)+' – '+fmtDate(last))}
 </div>
 <div class="card-title">AKTIVITAS HARIAN</div>
 <div class="list">${days.map(d=>`<div class="row" style="gap:9px"><span class="small" style="width:48px;flex:0 0 48px">${d.label} ${d.date}</span><div style="flex:1;min-width:0">${bar(d.possible?d.rate:0)}</div><b style="font-size:10px;min-width:65px;text-align:right">${d.completed}/${d.possible}</b></div>`).join('')}</div>
 <small class="muted">Aktivitas harian menghitung jadwal dan habit yang selesai dibandingkan jumlah yang direncanakan. Keuangan dihitung dari transaksi dalam periode yang sama.</small>
 `)
}

function homeView(){const d=today(),tasks=dayTasks(d),s=totals(txMonth()),due=S.reminders.filter(r=>r.date<=d),pending=S.study.filter(t=>!t.done&&t.due<=d);return `${section('Dashboard','Satu tempat untuk melihat hal penting hari ini.')}<div class="stats">${stat('Jadwal hari ini',tasks.length)}${stat('Habit selesai',S.habits.filter(h=>h.log&&h.log[d]).length+'/'+S.habits.length,'green')}${stat('Sisa bulan ini',money(s.in-s.out),(s.in-s.out)<0?'red':'purple')}</div>${card('FOKUS HARI INI',tasks.length?`<div class="list">${tasks.slice(0,4).map(t=>`<div class="entry ${t.done&&t.done[d]?'done':''}"><button class="check" data-action="toggle-task" data-id="${t.id}">${t.done&&t.done[d]?'✓':''}</button><div class="grow"><b>${esc(t.name)}</b><small>${t.time||'Tanpa jam'}</small></div></div>`).join('')}</div>`:'<div class="empty">Belum ada aktivitas. Tambahkan rencana hari ini.</div>')}${weeklySummary()}<div class="actions"><button class="btn primary" data-page="planner">Buka planner</button><button class="btn soft" data-page="finance">Catat keuangan</button></div>${card('PERLU PERHATIAN',`${due.length?`<div class="notice">${due.length} pengingat sudah jatuh tempo atau untuk hari ini.</div>`:''}${pending.length?`<div class="notice">${pending.length} tugas belajar perlu diselesaikan hari ini atau sudah lewat deadline.</div>`:''}${!due.length&&!pending.length?'<div class="empty">Tidak ada pengingat mendesak. Pertahankan ritmemu.</div>':''}<button class="btn ghost" data-page="reminders">Lihat pengingat</button>`)}${card('TARGET TABUNGAN',S.goal?`<div class="row"><b>${esc(S.goal.name)}</b><b>${Math.min(100,Math.round(S.tx.filter(t=>t.type==='out'&&t.cat==='Tabungan').reduce((a,t)=>a+t.amt,0)/S.goal.target*100))}%</b></div>${bar(S.tx.filter(t=>t.type==='out'&&t.cat==='Tabungan').reduce((a,t)=>a+t.amt,0)/S.goal.target*100)}<small class="muted">${money(S.tx.filter(t=>t.type==='out'&&t.cat==='Tabungan').reduce((a,t)=>a+t.amt,0))} terkumpul dari ${money(S.goal.target)}</small>`:'<p class="small">Buat target tabungan di menu More → Pengaturan.</p>')}`}
function render(){const name=S.profile.name?`, ${esc(S.profile.name)}`:'';$('#greeting').textContent=S.profile.name?`Welcome back${name}.`:'Make space for what matters.';$('#heroSub').textContent='Atur waktu, keuangan, dan kebiasaanmu dalam satu ruang.';$('#todayLabel').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});$('#tabs').innerHTML=tabs.map(([id,ic,l])=>`<button data-page="${id}" class="${page===id?'active':''}"><span>${ic}</span>${l}</button>`).join('');let content=page==='home'?homeView():page==='planner'?plannerView():page==='habit'?habitView():page==='study'?studyView():page==='finance'?financeView():page==='review'?reviewView():page==='reminders'?remindersView():settingsView();if(page==='settings')content=settingsView();$('#view').innerHTML=content}
function openStudyForm(){const form=`<form id="studyForm" class="card"><div class="card-title">TAMBAH TUGAS BELAJAR</div><div class="field"><label>Nama tugas</label><input name="name" required maxlength="80" placeholder="Contoh: Makalah sejarah"></div><div class="form-grid"><div class="field"><label>Mata pelajaran / mata kuliah</label><input name="subject" maxlength="40" placeholder="Sejarah"></div><div class="field"><label>Deadline</label><input name="due" type="date" required value="${today()}"></div></div><div class="actions"><button class="btn ghost" type="button" data-action="cancel-study">Batal</button><button class="btn primary">Simpan tugas</button></div></form>`;$('#view').insertAdjacentHTML('afterbegin',form);$('#studyForm').scrollIntoView({behavior:'smooth',block:'center'})}
function notifyDue(){if(!('Notification'in window)||Notification.permission!=='granted')return;const now=new Date(),stamp=now.toISOString().slice(0,16);S.reminders.forEach(r=>{if(r.date!==today())return;const key=r.date+'T'+(r.time||'00:00');if(key<=stamp&&!r.notified){try{new Notification('VELORA · Pengingat',{body:r.title});r.notified=true;save()}catch(e){}}})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-page]');if(!b)return;if(b.dataset.page){page=b.dataset.page;editTask=null;editTx=null;render();return}const a=b.dataset.action,id=b.dataset.id;
if(a==='new-task'){editTask={};render();return}if(a==='cancel-task'){editTask=null;render();return}
if(a==='edit-task'){editTask=S.tasks.find(t=>t.id===id)||{};render();return}
if(a==='delete-task'){if(confirm('Hapus aktivitas ini?'))S.tasks=S.tasks.filter(t=>t.id!==id)}
if(a==='toggle-task'){const t=S.tasks.find(t=>t.id===id);if(t){t.done=t.done||{};t.done[today()]=!t.done[today()]}}
if(a==='new-habit'){const n=prompt('Nama kebiasaan baru:');if(n&&n.trim())S.habits.push({id:uid(),name:n.trim(),log:{}})}
if(a==='toggle-habit'){const h=S.habits.find(h=>h.id===id);if(h){h.log=h.log||{};h.log[today()]=!h.log[today()]}}
if(a==='delete-habit'){if(confirm('Hapus habit ini?'))S.habits=S.habits.filter(h=>h.id!==id)}
if(a==='new-study'){openStudyForm();return}
if(a==='cancel-study'){const f=$('#studyForm');if(f)f.remove();return}
if(a==='toggle-study'){const t=S.study.find(t=>t.id===id);if(t)t.done=!t.done}
if(a==='delete-study'){if(confirm('Hapus tugas belajar ini?'))S.study=S.study.filter(t=>t.id!==id)}
if(a==='edit-study'){const t=S.study.find(t=>t.id===id);if(t){const name=prompt('Nama tugas:',t.name);if(name===null)return;const subject=prompt('Mata pelajaran:',t.subject||'');const due=prompt('Deadline (YYYY-MM-DD):',t.due);if(name.trim()&&due){t.name=name.trim();t.subject=subject||'';t.due=due}}}
if(a==='month-prev'){month.setMonth(month.getMonth()-1)}
if(a==='month-next'){month.setMonth(month.getMonth()+1)}
if(a==='edit-tx'){editTx=S.tx.find(t=>t.id===id)||null;render();return}
if(a==='cancel-tx'){editTx=null;render();return}
if(a==='delete-tx'){if(confirm('Hapus transaksi ini?'))S.tx=S.tx.filter(t=>t.id!==id)}
if(a==='save-total-budget'){const v=Number($('#totalBudget')?.value);if(v>=0)S.bud.__total=v||0}
if(a==='save-category-budget'){const c=$('#budgetCat').value,v=Number($('#budgetAmt').value);if(v>0)S.bud[c]=v;else alert('Masukkan batas lebih dari 0.')}
if(a==='delete-reminder'){S.reminders=S.reminders.filter(r=>r.id!==id)}
if(a==='save-reflection'){S.reflections=S.reflections||{};S.reflections[iso(month).slice(0,7)]=$('#reflection').value;alert('Refleksi tersimpan.')}
if(a==='enable-notifications'){if('Notification'in window)Notification.requestPermission().then(()=>render());else alert('Browser ini belum mendukung notifikasi.');return}
if(a==='export'){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a1=document.createElement('a');a1.href=url;a1.download='velora-backup-'+today()+'.json';a1.click();URL.revokeObjectURL(url);return}
if(a==='import'){$('#importFile').click();return}
if(a==='reset'){if(confirm('Hapus seluruh data VELORA? Pastikan sudah membuat backup jika masih diperlukan.')){S=defaults();page='home';editTx=null;editTask=null}}
save();render()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f),v=Object.fromEntries(fd.entries());
if(f.id==='taskForm'){const n=v.name.trim();if(!n)return;const picked=fd.getAll('days').map(Number).filter(x=>Number.isInteger(x)&&x>=0&&x<=6);if(v.repeat==='custom'&&!picked.length){alert('Pilih minimal satu hari untuk pengulangan hari tertentu.');return}const task={id:editTask?.id||uid(),name:n,date:v.date,time:v.time,imp:v.priority==='high',daily:v.repeat==='daily',days:v.repeat==='custom'?picked:null,from:v.date,done:editTask?.done||{}};if(editTask?.id)S.tasks=S.tasks.map(t=>t.id===task.id?task:t);else S.tasks.push(task);editTask=null;page='planner'}
if(f.id==='studyForm'){S.study.push({id:uid(),name:v.name.trim(),subject:v.subject||'',due:v.due,done:false});page='study'}
if(f.id==='txForm'){const t={id:editTx?.id||uid(),type:v.type,amt:Number(v.amt),cat:v.cat,date:v.date,note:v.note||''};if(!(t.amt>0)){alert('Nominal harus lebih dari 0.');return}if(editTx)S.tx=S.tx.map(x=>x.id===t.id?t:x);else S.tx.push(t);editTx=null;page='finance';const dt=new Date(t.date+'T12:00');month=new Date(dt.getFullYear(),dt.getMonth(),1)}
if(f.id==='reminderForm'){S.reminders.push({id:uid(),title:v.title.trim(),date:v.date,time:v.time,notified:false});page='reminders'}
if(f.id==='settingsForm'){S.profile.name=v.name.trim();S.profile.theme=v.theme;document.documentElement.dataset.theme=v.theme}
if(f.id==='goalForm'){if(v.name.trim()&&Number(v.target)>0)S.goal={name:v.name.trim(),target:Number(v.target)};else{alert('Isi nama dan target tabungan yang valid.');return}}
save();render()});
document.addEventListener('change',e=>{if(e.target.name==='repeat'){const picker=$('#weekdayPicker');if(picker)picker.classList.toggle('hidden',e.target.value!=='custom')}if(e.target.name==='days'){const label=e.target.closest('label');if(label)label.classList.toggle('active',e.target.checked)}if(e.target.id==='importFile'){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||!Array.isArray(data.tasks)||!Array.isArray(data.tx))throw Error();if(!confirm('Impor backup akan mengganti data VELORA saat ini. Lanjutkan?'))return;S=normalize(data);document.documentElement.dataset.theme=S.profile.theme;save();render();alert('Backup berhasil dipulihkan.')}catch(err){alert('File backup tidak valid atau formatnya tidak dikenali.')}};reader.readAsText(file);e.target.value=''}});
render();notifyDue();setInterval(notifyDue,30000);
})();
</script>
